description: |-
  Dense-LiDAR Town06 SGCP multi-scene dataset export.
  This scenario is designed as a non-roundabout companion to
  v2xp_cluster_carla_dense:
  - Town06 map.
  - 10 CAVs total: 1 explicit single CAV plus 9 traffic CAV managers.
  - 20 unmanaged background vehicles.
  - Same dense LiDAR setting as v2xp_cluster_carla_dense.

blueprint:
  use_multi_class_bp: false
  bp_meta_path: "opencda/assets/blueprint_meta/bbx_stats_0911.json"
  bp_class_sample_prob:
    car: 0.5
    truck: 0.1
    bus: 0.1
    bicycle: 0.1
    motorcycle: 0.1

carla_traffic_manager:
  sync_mode: true
  global_distance: 5
  global_speed_perc: -10
  set_osm_mode: true
  auto_lane_change: true
  random: true
  ignore_lights_percentage: 100
  vehicle_list: ~
  range:
    # x_min, x_max, y_min, y_max, x_step, y_step, vehicle_num, vehicle_manager_num
    # 29 traffic vehicles -> 9 managed traffic CAVs + 20 background vehicles.
    - [-11, 12, 100, 220, 3.5, 15, 29, 9]

scenario:
  single_cav_list:
    -
      spawn_position: [12.00, 192.31, 0.3, 0, -90, 0]
      destination: [67.12, 150.2, 1.0]
      behavior:
        local_planner:
          debug_trajectory: false
          debug: false

vehicle_base:
  sensing:
    perception:
      lidar:
        visualize: true
        channels: 32
        range: 50
        points_per_second: 320000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
        enable_grids: false

traffic_vehicle_base:
  sensing:
    perception:
      lidar:
        visualize: false
        channels: 32
        range: 50
        points_per_second: 320000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
        enable_grids: false

coperception:
  models:
    early: 'opencood/logs/pointpillar_early_fusion'
    intermediate_v2xvit: 'opencood/logs/pointpillar_v2xvit_fusion'
    intermediate_attentive: 'opencood/logs/pointpillar_attentive_fusion'
    intermediate_cobevt: 'opencood/logs/pointpillar_cobevt_fusion'
    late: 'opencood/logs/pointpillar_late_fusion'
  fusion_method: 'early'
