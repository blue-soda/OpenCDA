description: |-
  Easy LGCP-oriented Town03 ordinary-intersection diagnostic configuration.

  This scenario avoids the Town03 roundabout and focuses on a smaller ordinary
  junction near (1.10, 133.72):
  - Town03 map.
  - 20 total vehicles: 10 explicit CAVs plus 10 background vehicles.
  - Fixed spawn points on the selected intersection approaches; no rectangle
    range sampling is used, because CARLA waypoint snapping can otherwise place
    vehicles on adjacent residential roads.
  - A compact 90m x 70m RoI with coarse 30m x 24m LGCP areas, yielding
    about 9 total areas for feature-communication diagnostics.

  Intended use: produce an easier OPV2V-style diagnostic dataset where full
  early fusion should be strong enough to sanity-check LGCP area and leader
  mechanisms before returning to denser scalability settings.

blueprint:
  use_multi_class_bp: false
  bp_meta_path: "opencda/assets/blueprint_meta/bbx_stats_0911.json"
  bp_class_sample_prob:
    car: 1.00
    truck: 0.00
    bus: 0.00
    bicycle: 0.00
    motorcycle: 0.00

lgcp:
  enabled: true
  roi:
    center: [1.0, 134.0]
    size: [90.0, 70.0]
    grid_size: [30.0, 24.0]
  target_cav_num: 10
  target_total_vehicle_num: 20
  area_confidence:
    delta_g: 0.075
  notes:
    - "Easy ordinary-intersection diagnostic setting for AP-gated LGCP mechanism tests."
    - "Do not use as dense scalability evidence."

vehicle_base:
  sensing:
    perception:
      lidar:
        visualize: true
        range: 90
        enable_grids: true
        grid_size: 10.0
        density_threshold: 2.0
  v2x:
    communication_range: 80

traffic_vehicle_base:
  sensing:
    perception:
      lidar:
        visualize: false
        range: 90
        enable_grids: true
        grid_size: 10.0
        density_threshold: 2.0
  v2x:
    communication_range: 80

rsu_base:
  sensing:
    perception:
      activate: false
      camera:
        visualize: 0
        num: 0
        positions: []
      lidar:
        visualize: true
        channels: 32
        range: 120
        points_per_second: 800000
        rotation_frequency: 20
        upper_fov: 2
        lower_fov: -25
        dropoff_general_rate: 0.3
        dropoff_intensity_limit: 0.7
        dropoff_zero_intensity: 0.4
        noise_stddev: 0.02
        enable_grids: true
        grid_size: 10.0
        density_threshold: 2.0
    localization:
      activate: false
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6

carla_traffic_manager:
  sync_mode: true
  global_distance: 8
  global_speed_perc: -15
  set_osm_mode: true
  auto_lane_change: false
  random: true
  ignore_lights_percentage: 100
  vehicle_list:
    - spawn_position: [-5.92, 111.38, 0.3, 0, 89.6, 0]
    - spawn_position: [-9.42, 111.40, 0.3, 0, 89.6, 0]
    - spawn_position: [-13.93, 168.73, 0.3, 0, 168.9, 0]
    - spawn_position: [5.79, 179.76, 0.3, 0, -90.4, 0]
    - spawn_position: [2.29, 179.78, 0.3, 0, -90.4, 0]
    - spawn_position: [-5.71, 179.83, 0.3, 0, 89.6, 0]
    - spawn_position: [-9.21, 179.85, 0.3, 0, 89.6, 0]
    - spawn_position: [5.85, 189.19, 0.3, 0, -90.4, 0]
    - spawn_position: [2.35, 189.22, 0.3, 0, -90.4, 0]
    - spawn_position: [-13.38, 193.56, 0.3, 0, 179.9, 0]
  range: []

